# ==============================================================
# GRIEVORA - Spring Boot 3 & MySQL Application Configuration
# ==============================================================
spring.application.name=grievora-backend
server.port=8080

# Active Profile: 'mysql' for production/local MySQL, 'h2' for memory testing
spring.profiles.active=mysql

# Database Connection (MySQL 8+)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:grievora_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Scripts initialization (optional for auto-seeding)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# File Upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Session Configuration
server.servlet.session.timeout=120m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Logging
logging.level.com.grievora=INFO
logging.level.org.springframework.security=WARN
